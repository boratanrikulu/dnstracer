apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dnstracer-comprehensive
  namespace: dns-tracing
  labels:
    app: dnstracer-comprehensive
spec:
  selector:
    matchLabels:
      app: dnstracer-comprehensive
  template:
    metadata:
      labels:
        app: dnstracer-comprehensive
    spec:
      serviceAccountName: dnstracer
      hostNetwork: true
      hostPID: true
      containers:
      # Monitor bridge interfaces for internal DNS
      - name: dnstracer-bridge
        image: dnstracer:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_ADMIN
            - SYS_RESOURCE
            - BPF
        env:
        - name: DNSTRACER_USE_PERFBUF
          value: "false"
        - name: DNSTRACER_INTERFACE
          value: "bridge"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      
      # Monitor docker0 interface (if exists)
      - name: dnstracer-docker
        image: dnstracer:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_ADMIN
            - SYS_RESOURCE
            - BPF
        env:
        - name: DNSTRACER_USE_PERFBUF
          value: "false"
        - name: DNSTRACER_INTERFACE
          value: "docker0"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "5m"
          limits:
            memory: "64Mi"
            cpu: "50m"
            
      # Monitor primary network interface for external DNS
      - name: dnstracer-external
        image: dnstracer:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_ADMIN
            - SYS_RESOURCE
            - BPF
        env:
        - name: DNSTRACER_USE_PERFBUF
          value: "false"
        - name: DNSTRACER_INTERFACE
          value: "eth0"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "5m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      
      volumes:
      - name: bpf-fs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule