apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dnstracer
  namespace: dns-tracing
  labels:
    app: dnstracer
spec:
  selector:
    matchLabels:
      app: dnstracer
  template:
    metadata:
      labels:
        app: dnstracer
    spec:
      serviceAccountName: dnstracer
      hostNetwork: true
      hostPID: true
      containers:
      - name: dnstracer
        image: dnstracer:latest
        imagePullPolicy: Never  # For local testing
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_ADMIN
            - SYS_RESOURCE
            - BPF
        env:
        - name: DNSTRACER_USE_PERFBUF
          value: "false"
        - name: DNSTRACER_INTERFACE
          value: "bridge"  # Minikube uses 'bridge', may need adjustment per cluster (cni0, flannel.1, etc.)
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: bpf-fs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule